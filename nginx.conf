# Nginx agnostique au domaine : le routage par hôte, la redirection HTTPS et
# la redirection apex → www sont gérés par Traefik (labels docker-compose.yml).
server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml
        application/xml+rss
        image/svg+xml
        font/woff
        font/woff2;

    # Astro fingerprints bundled assets, so they can be cached permanently.
    location /_astro/ {
        expires 1y;
        access_log off;
        try_files $uri =404;
    }

    # Site assets use a long but finite cache lifetime.
    location ~* \.(?:png|jpg|jpeg|gif|ico|svg|webp|avif|woff|woff2|ttf|eot)$ {
        expires 30d;
        access_log off;
        try_files $uri =404;
    }

    location = /robots.txt {
        expires 1h;
        try_files $uri =404;
    }

    location ~ ^/sitemap.*\.xml$ {
        expires 1h;
        try_files $uri =404;
    }

    # Astro SSG writes trailing-slash routes as directories containing index.html.
    location / {
        try_files $uri $uri/ $uri.html =404;
        expires -1;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
}
